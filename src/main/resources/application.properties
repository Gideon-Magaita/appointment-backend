spring.config.import=optional:file:.env[.properties]
spring.application.name=appointment

spring.datasource.url=${LOCAL_DB_POSTGRESQL_URL}
spring.datasource.username=${LOCAL_DB_POSTGRESQL_USERNAME}
spring.datasource.password=${LOCAL_DB_POSTGRESQL_PASSWORD}
spring.jpa.database-platform=${LOCAL_DB_POSTGRESQL_PLATFORM}
spring.jpa.hibernate.ddl-auto=${LOCAL_DB_POSTGRESQL_HIBERNATE}


#JWT Configurations
jwt.secret.string=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION_TIME}


#SMTP MAIL CONFIGURATIONS
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587

#Enable  TLS SMTP Mail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


login.link=http://localhost:4200/login
password.reset.link=http://localhost:4200/reset-password?code=












